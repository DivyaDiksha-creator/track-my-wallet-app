<main class="expense-form-page-container">
  <div class="app-card expense-form-card">
    <h2>{{ pageTitle }}</h2>

    <div *ngIf="isLoading" class="loading-message text-center mt-md">Loading form data...</div>
    <div *ngIf="errorMessage" class="error-message text-center mt-md">{{ errorMessage }}</div>
    <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="expense-form" *ngIf="!isLoading">
      <div class="form-group">
        <label for="description">Description <span class="required">*</span></label>
        <input type="text" id="description" formControlName="description" placeholder="e.g., Weekly groceries, Dinner with friends">
        <div *ngIf="expenseForm.get('description')?.invalid && expenseForm.get('description')?.touched" class="error-message-small">
          Description is required.
        </div>
      </div>

      <div class="form-group">
        <label for="amount">Amount <span class="required">*</span></label>
        <input type="number" id="amount" formControlName="amount" placeholder="e.g., 50.00" step="0.01">
        <div *ngIf="expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched" class="error-message-small">
          Amount is required and must be a positive number.
        </div>
      </div>

      <div class="form-group">
        <label for="date">Date <span class="required">*</span></label>
        <input type="date" id="date" formControlName="date">
        <div *ngIf="expenseForm.get('date')?.invalid && expenseForm.get('date')?.touched" class="error-message-small">
          Date is required.
        </div>
      </div>

      <div class="form-group">
        <label for="categoryId">Category <span class="required">*</span></label>
        <select id="categoryId" formControlName="categoryId">
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">
            {{ category.name }}
          </option>
        </select>
        <div *ngIf="expenseForm.get('categoryId')?.invalid && expenseForm.get('categoryId')?.touched" class="error-message-small">
          Category is required.
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="expenseForm.invalid">
          {{ isEditMode ? 'Update Expense' : 'Add Expense' }}
        </button>
      </div>
    </form>
  </div>
</main>
